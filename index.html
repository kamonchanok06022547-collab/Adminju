<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN MONITOR - LEKWIN JUNIOR</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-blue: #1565c0;
            --pastel-blue: #e3f2fd;
            --vivid-green: #4caf50;
            --vivid-red: #e53935;
            --offline-gray: #bdc3c7;
        }

        .swal2-popup { border-radius: 25px !important; padding: 2em !important; width: 340px !important; }
        .swal2-title { color: #444 !important; font-size: 1.5rem !important; font-weight: bold !important; }
        .swal2-confirm { border-radius: 12px !important; padding: 12px 20px !important; font-weight: bold !important; background-color: #3b82f6 !important; }
        .swal2-cancel { border-radius: 12px !important; padding: 12px 20px !important; background-color: #6c757d !important; }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--pastel-blue); color: #444; }
        body { display: flex; flex-direction: column; align-items: center; padding: 15px 10px; }
        .container { width: 100%; max-width: 750px; }
        
        .header-box { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: white; padding: 10px 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; border: 1px solid #d1e9ff; }
        .header-box img { width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--primary-blue); object-fit: cover; }
        .header-box h2 { margin: 0; font-size: 1.1rem; color: var(--primary-blue); }

        .card { background: #fff; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #d1e9ff; }
        .card h3 { margin: 0 0 12px 0; font-size: 1rem; color: var(--primary-blue); border-bottom: 2px solid #f0f4f8; padding-bottom: 8px; }
        
        .create-box { display: flex; flex-direction: column; gap: 10px; }
        .create-box input { padding: 12px; border-radius: 12px; border: 1.5px solid #eee; outline: none; text-align: center; }
        .create-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-new-30 { background: #ce93d8; color: white; padding: 12px; border-radius: 10px; font-weight: bold; border:none; cursor: pointer; }
        .btn-new-perm { background: #4fc3f7; color: white; padding: 12px; border-radius: 10px; font-weight: bold; border:none; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        td { padding: 10px 8px; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }
        th { text-align: left; color: #888; font-size: 0.7rem; padding-bottom: 5px; border-bottom: 2px solid #eee; }

        button { cursor: pointer; border: none; font-weight: 600; border-radius: 8px; padding: 6px 10px; font-size: 0.7rem; }
        .btn-perm { background: #fdf2f8; color: #db2777; margin-right: 3px; }
        .btn-add { background: #f0fdf4; color: #16a34a; margin-right: 3px; }
        .btn-set { background: #e0f2f1; color: #00796b; margin-right: 3px; }
        .btn-del { background: #fef2f2; color: #dc2626; }
        .btn-kick { background: #fffde7; color: #fbc02d; margin-right: 5px; }
        .btn-ban { background: #ffebee; color: #c62828; }

        #loginOverlay { position: fixed; inset: 0; background: #e3f2fd; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 25px; text-align: center; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .dot-online { background-color: var(--vivid-green); box-shadow: 0 0 8px var(--vivid-green); }
        .dot-offline { background-color: var(--offline-gray); }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <img src="https://i.pinimg.com/1200x/7a/82/11/7a8211a2161799550aa868aaab6d5c84.jpg" style="width:100px; height:100px; object-fit:cover; border-radius:20px; margin-bottom:15px; border: 3px solid #1565c0;">
        <h3>Admin Login</h3>
        <input id="adminUser" type="text" placeholder="ชื่อผู้ใช้แอดมิน" style="width:100%; padding:12px; margin-bottom:10px; border-radius:12px; border:1px solid #ddd; text-align:center;">
        <input id="adminPass" type="password" placeholder="รหัสผ่านแอดมิน" style="width:100%; padding:12px; margin-bottom:12px; border-radius:12px; border:1px solid #ddd; text-align:center;">
        <button onclick="doLogin()" style="background: var(--primary-blue); color:white; width:100%; padding:12px; border-radius:12px; border:none; font-weight:bold;">เข้าสู่ระบบ ✨</button>
    </div>
</div>

<div id="main" class="container" style="display:none; padding-top: 20px;">
    <div class="header-box">
        <img src="https://i.pinimg.com/1200x/7a/82/11/7a8211a2161799550aa868aaab6d5c84.jpg" alt="Admin">
        <div>
            <h2>ADMIN MONITOR</h2>
            <small style="color: #888;">จัดการชื่อผู้ใช้และรหัสผ่าน</small>
        </div>
    </div>

    <div class="card">
        <h3>✨ สร้างยูสเซอร์ใหม่</h3>
        <div class="create-box">
            <input id="newUsername" type="text" placeholder="ตั้งชื่อผู้ใช้งาน (Username)">
            <input id="newPassword" type="text" placeholder="ตั้งรหัสผ่าน (Password)">
            <div class="create-btns">
                <button class="btn-new-30" onclick="addNewCode(false)">📞 30 วัน</button>
                <button class="btn-new-perm" onclick="addNewCode(true)">♾️ ถาวร</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>👥 ออนไลน์ตอนนี้</h3>
        <table>
            <thead>
                <tr><th width="30"></th><th>ชื่อผู้เล่น</th><th>รหัสที่ใช้</th><th align="right">จัดการ</th></tr>
            </thead>
            <tbody id="onlineListTbody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>✨ รายชื่อยูสเซอร์ในระบบ</h3>
        <table>
            <thead>
                <tr><th>User / Pass</th><th>วันหมดอายุ</th><th align="right">จัดการ</th></tr>
            </thead>
            <tbody id="newCodesTbody"></tbody>
        </table>
    </div>

    <button onclick="doLogout()" style="background:#b0bec5; color:white; width:100%; padding:12px; border-radius:12px; margin-bottom:40px; font-weight:bold; border:none;">LOGOUT</button>
</div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1iAT_0vKk6Uew2VJtN3_wx4JszVTTTjY",
    authDomain: "junior-nior.firebaseapp.com",
    databaseURL: "https://junior-nior-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "junior-nior",
    storageBucket: "junior-nior.firebasestorage.app",
    messagingSenderId: "225309280850",
    appId: "1:225309280850:web:49e3f857eb8a4a250a2d8b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- ADMIN LOGIN CONFIG ---
const MASTER_USER = "adminwin"; 
const MASTER_PASS = "adminwinjuniorkmcn0602";
const PERM_VAL = 32503680000000; // ค่าคงที่สำหรับวันถาวร

function doLogin() {
    const u = document.getElementById("adminUser").value;
    const p = document.getElementById("adminPass").value;
    if(u === MASTER_USER && p === MASTER_PASS) {
        sessionStorage.setItem("adminLoggedIn", "true");
        checkAuth();
    } else {
        Swal.fire('ข้อมูลไม่ถูกต้อง', 'กรุณาตรวจสอบชื่อและรหัสผ่าน', 'error');
    }
}

function checkAuth() {
    if(sessionStorage.getItem("adminLoggedIn") === "true") {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("main").style.display = "block";
        loadData();
    }
}

function doLogout() {
    sessionStorage.clear();
    location.reload();
}

// --- การจัดการข้อมูล ---

function formatThaiDate(ts) {
    if (ts >= 3000000000000) return "ไม่มีวันหมดอายุ";
    const d = new Date(ts);
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear() + 43).slice(-2)}`;
}

function loadData() {
    db.ref().on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const custom = data.custom_codes || {};
        const online = data.online_users || {};
        
        // 1. แสดงคนออนไลน์
        const onlineTbody = document.getElementById("onlineListTbody");
        onlineTbody.innerHTML = "";
        Object.keys(online).forEach(key => {
            const user = online[key];
            if(user.status === 'online') {
                onlineTbody.innerHTML += `<tr>
                    <td align="center"><span class="status-dot dot-online"></span></td>
                    <td><b>${user.name || 'ไม่ทราบชื่อ'}</b></td>
                    <td><small>${user.pass}</small></td>
                    <td align="right">
                        <button class="btn-kick" onclick="popKick('${key}')">เตะ</button>
                    </td>
                </tr>`;
            }
        });

        // 2. แสดงรายการ User ทั้งหมด
        const newTbody = document.getElementById("newCodesTbody");
        newTbody.innerHTML = "";
        Object.keys(custom).forEach(id => {
            const item = custom[id];
            const exp = item.expireAt;
            const isPerm = exp >= 3000000000000;
            
            let statusHTML = "";
            if (isPerm) {
                statusHTML = "<b style='color:#db2777;'>ถาวร</b>";
            } else {
                const diff = exp - Date.now();
                if (diff > 0) {
                    const days = Math.floor(diff / 86400000);
                    statusHTML = `<span style="color:#2e7d32;">เหลือ ${days} วัน</span><br><small>${formatThaiDate(exp)}</small>`;
                } else {
                    statusHTML = "<span style='color:grey;'>หมดอายุ</span>";
                }
            }

            newTbody.innerHTML += `<tr>
                <td><b>${item.username || 'N/A'}</b><br><small style="color:#1565c0;">Pass: ${item.password}</small></td>
                <td>${statusHTML}</td>
                <td align="right">
                    <button class="btn-add" onclick="popAddDays('${id}')">+</button>
                    <button class="btn-del" onclick="popDelete('${id}')">🗑️</button>
                </td>
            </tr>`;
        });
    });
}

function addNewCode(isP) {
    const u = document.getElementById("newUsername").value.trim();
    const p = document.getElementById("newPassword").value.trim();
    
    if(!u || !p) {
        Swal.fire('เตือน', 'กรุณากรอกทั้ง User และ Pass', 'warning');
        return;
    }

    // ใช้ Password เป็น Key ในการเก็บข้อมูลเพื่อให้ง่ายต่อการค้นหาตอน Login หน้าบ้าน
    db.ref('custom_codes/' + p).set({
        username: u,
        password: p,
        expireAt: isP ? PERM_VAL : Date.now() + (30 * 86400000)
    }).then(() => {
        document.getElementById("newUsername").value = "";
        document.getElementById("newPassword").value = "";
        Swal.fire({ icon: 'success', title: 'สร้างสำเร็จ', timer: 800, showConfirmButton: false });
    });
}

function popKick(key) {
    Swal.fire({ title: 'เตะผู้ใช้?', text: 'ผู้ใช้จะถูกออกจากระบบทันที', showCancelButton: true, confirmButtonText: 'ยืนยัน' })
    .then((r) => { if(r.isConfirmed) db.ref('online_users/' + key).remove(); });
}

function popDelete(id) {
    Swal.fire({ title: 'ลบยูสเซอร์?', text: 'ข้อมูลจะหายไปถาวร', showCancelButton: true, confirmButtonText: 'ลบเลย' })
    .then((r) => { if(r.isConfirmed) db.ref('custom_codes/' + id).remove(); });
}

function popAddDays(id) {
    Swal.fire({ title: 'เพิ่มจำนวนวัน', input: 'number', inputValue: 30, showCancelButton: true })
    .then((r) => {
        if(r.isConfirmed && r.value) {
            db.ref('custom_codes/' + id).once('value', s => {
                let cur = (s.val() && s.val().expireAt > Date.now()) ? s.val().expireAt : Date.now();
                db.ref('custom_codes/' + id).update({ expireAt: cur + (parseFloat(r.value) * 86400000) });
            });
        }
    });
}

checkAuth();
</script>
</body>
</html>
