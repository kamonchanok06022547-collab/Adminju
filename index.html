<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN MONITOR - LEKWIN JUNIOR</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-blue: #1565c0;
            --pastel-blue: #e3f2fd;
            --vivid-green: #4caf50;
            --vivid-red: #e53935;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; padding: 15px; background: var(--pastel-blue); display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }

        /* Login Overlay */
        #loginOverlay { position: fixed; inset: 0; background: #e3f2fd; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; width: 90%; max-width: 350px; padding: 30px; border-radius: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; text-align: center; }

        /* Header */
        .header-box { display: flex; align-items: center; gap: 15px; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #d1e9ff; }
        .header-box img { width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--primary-blue); }

        /* Card Style */
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #d1e9ff; }
        .card h3 { margin: 0 0 15px 0; color: var(--primary-blue); border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; }

        /* Create User Section */
        .create-box { display: flex; flex-direction: column; gap: 10px; }
        .create-box input { padding: 12px; border-radius: 12px; border: 1.5px solid #eee; text-align: center; outline: none; }
        .create-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Table Style */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 10px; color: #888; border-bottom: 2px solid #eee; }
        td { padding: 12px 10px; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }

        /* Status Dot */
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .dot-online { background-color: var(--vivid-green); box-shadow: 0 0 8px var(--vivid-green); }
        .dot-offline { background-color: #bdc3c7; }

        /* Buttons */
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; padding: 8px 12px; transition: 0.2s; }
        .btn-main { background: var(--primary-blue); color: white; }
        .btn-30 { background: #ce93d8; color: white; }
        .btn-perm { background: #4fc3f7; color: white; }
        .btn-add { background: #f0fdf4; color: #16a34a; margin: 2px; }
        .btn-set { background: #e0f2f1; color: #00796b; margin: 2px; }
        .btn-del { background: #fef2f2; color: #dc2626; margin: 2px; }
        .btn-kick { background: #fffde7; color: #fbc02d; }
        .btn-ban { background: #ffebee; color: #c62828; }
        .btn-unban { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <img src="https://i.pinimg.com/1200x/7a/82/11/7a8211a2161799550aa868aaab6d5c84.jpg" style="width:80px; height:80px; border-radius:20px; margin-bottom:15px; object-fit: cover;">
        <h3>Admin Access</h3>
        <input id="adminUser" type="text" placeholder="Admin Username">
        <input id="adminPass" type="password" placeholder="Admin Password">
        <button class="btn-main" onclick="doLogin()" style="width:100%; padding:14px; border-radius:12px;">LOGIN ✨</button>
    </div>
</div>

<div id="main" class="container" style="display:none;">
    <div class="header-box">
        <img src="https://i.pinimg.com/1200x/7a/82/11/7a8211a2161799550aa868aaab6d5c84.jpg">
        <div>
            <h2 style="margin:0; color:var(--primary-blue);">MONITOR PANEL</h2>
            <small style="color: #888;">ระบบจัดการสมาชิกแบบ User/Pass</small>
        </div>
    </div>

    <div class="card">
        <h3>✨ สร้างยูสเซอร์ใหม่</h3>
        <div class="create-box">
            <input id="newUsername" type="text" placeholder="ตั้งชื่อผู้ใช้งาน (Username)">
            <input id="newPassword" type="text" placeholder="ตั้งรหัสผ่าน (Password)">
            <div class="create-btns">
                <button class="btn-30" onclick="addNewCode(false)">🌿 30 วัน</button>
                <button class="btn-perm" onclick="addNewCode(true)">♾️ ถาวร</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>👥 กำลังออนไลน์</h3>
        <table>
            <thead>
                <tr><th width="30"></th><th>ชื่อผู้เล่น</th><th>รหัสผ่านที่ใช้</th><th align="right">จัดการ</th></tr>
            </thead>
            <tbody id="onlineListTbody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>📋 สมาชิกในระบบ</h3>
        <table>
            <thead>
                <tr><th>User / Pass</th><th>วันหมดอายุ</th><th align="right">จัดการ</th></tr>
            </thead>
            <tbody id="newCodesTbody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>🚫 รายชื่อที่ถูกแบน</h3>
        <table>
            <tbody id="bannedListTbody"></tbody>
        </table>
    </div>

    <button onclick="doLogout()" style="background:#b0bec5; color:white; width:100%; padding:12px; border-radius:12px; margin-bottom:50px;">ออกจากระบบ</button>
</div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1iAT_0vKk6Uew2VJtN3_wx4JszVTTTjY",
    authDomain: "junior-nior.firebaseapp.com",
    databaseURL: "https://junior-nior-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "junior-nior",
    storageBucket: "junior-nior.firebasestorage.app",
    messagingSenderId: "225309280850",
    appId: "1:225309280850:web:49e3f857eb8a4a250a2d8b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_USER_MASTER = "adminwin";
const ADMIN_PASS_MASTER = "adminwinjuniorkmcn0602";
const PERM_VAL = 32503680000000;

// --- Authentication ---
function doLogin() {
    const u = document.getElementById("adminUser").value;
    const p = document.getElementById("adminPass").value;
    if(u === ADMIN_USER_MASTER && p === ADMIN_PASS_MASTER) {
        sessionStorage.setItem("isAdminActive", "true");
        checkAuth();
    } else {
        Swal.fire('ผิดพลาด', 'Username หรือ Password ไม่ถูกต้อง', 'error');
    }
}

function checkAuth() {
    if(sessionStorage.getItem("isAdminActive") === "true") {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("main").style.display = "block";
        loadData();
    }
}

function doLogout() {
    sessionStorage.clear();
    location.reload();
}

function formatThaiDate(ts) {
    if (ts >= 3000000000000) return "ไม่มีวันหมดอายุ";
    const d = new Date(ts);
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear() + 43).slice(-2)}`;
}

// --- Load & Display Data ---
function loadData() {
    db.ref().on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const custom = data.custom_codes || {};
        const online = data.online_users || {};
        const banned = data.banned_codes || {};

        // 1. คนออนไลน์
        const onlineTbody = document.getElementById("onlineListTbody");
        onlineTbody.innerHTML = "";
        Object.keys(online).forEach(key => {
            const user = online[key];
            if(user.status === 'online') {
                onlineTbody.innerHTML += `<tr>
                    <td align="center"><span class="status-dot dot-online"></span></td>
                    <td><b>${user.name || 'ไม่ทราบชื่อ'}</b></td>
                    <td><small>${user.pass}</small></td>
                    <td align="right">
                        <button class="btn-kick" onclick="popKick('${key}')">เตะ</button>
                        <button class="btn-ban" onclick="popBan('${user.pass}')">แบน</button>
                    </td>
                </tr>`;
            }
        });

        // 2. รายชื่อยูสเซอร์
        const newTbody = document.getElementById("newCodesTbody");
        newTbody.innerHTML = "";
        Object.keys(custom).forEach(id => {
            const item = custom[id];
            const exp = item.expireAt;
            const isPerm = exp >= 3000000000000;
            let statusHTML = isPerm ? "<b style='color:#db2777;'>♾️ ถาวร</b>" : 
                (exp > Date.now() ? `<span style="color:#2e7d32; font-weight:bold;">${Math.floor((exp-Date.now())/86400000)} วัน</span>` : "<span style='color:grey;'>หมดอายุ</span>");

            newTbody.innerHTML += `<tr>
                <td><b>${item.username}</b><br><small style="color:var(--primary-blue);">Pass: ${item.password}</small></td>
                <td>${statusHTML}<br><small style="color:#888;">${formatThaiDate(exp)}</small></td>
                <td align="right">
                    <button class="btn-add" onclick="popAddDays('${id}')">+</button>
                    <button class="btn-set" onclick="popSetDays('${id}')">⚙️</button>
                    <button class="btn-del" onclick="popDelete('${id}')">🗑</button>
                </td>
            </tr>`;
        });

        // 3. รายชื่อแบน
        const banTbody = document.getElementById("bannedListTbody");
        banTbody.innerHTML = "";
        Object.keys(banned).forEach(c => {
            banTbody.innerHTML += `<tr><td><b style="color:red;">🚫 ${c}</b></td><td align="right"><button class="btn-unban" onclick="popUnban('${c}')">ปลดแบน</button></td></tr>`;
        });
    });
}

// --- Action Functions ---
function addNewCode(isP) {
    const u = document.getElementById("newUsername").value.trim();
    const p = document.getElementById("newPassword").value.trim();
    if(!u || !p) return Swal.fire('เตือน', 'กรุณากรอกให้ครบ', 'warning');

    db.ref('custom_codes/' + p).set({
        username: u, password: p,
        expireAt: isP ? PERM_VAL : Date.now() + (30 * 86400000)
    }).then(() => {
        document.getElementById("newUsername").value = "";
        document.getElementById("newPassword").value = "";
        Swal.fire({ icon: 'success', title: 'สร้างสำเร็จ', timer: 800, showConfirmButton: false });
    });
}

function popKick(key) {
    Swal.fire({ title: 'เตะผู้เล่น?', showCancelButton: true, confirmButtonText: 'เตะเลย' })
    .then(r => { if(r.isConfirmed) db.ref('online_users/' + key).remove(); });
}

function popBan(pass) {
    Swal.fire({ title: 'แบนรหัสนี้?', text: 'รหัสจะถูกลบและระงับการเข้าใช้', showCancelButton: true, confirmButtonText: 'แบนเลย' })
    .then(r => { if(r.isConfirmed) {
        db.ref('banned_codes/' + pass).set(true);
        db.ref('custom_codes/' + pass).remove();
        Swal.fire('สำเร็จ', 'ระงับการใช้งานเรียบร้อย', 'success');
    }});
}

function popUnban(pass) {
    db.ref('banned_codes/' + pass).remove();
    Swal.fire('ปลดแบนแล้ว', 'สร้างรหัสใหม่ให้ลูกค้าได้เลย', 'success');
}

function popDelete(id) {
    Swal.fire({ title: 'ลบข้อมูล?', showCancelButton: true, confirmButtonText: 'ลบเลย' })
    .then(r => { if(r.isConfirmed) db.ref('custom_codes/' + id).remove(); });
}

function popAddDays(id) {
    Swal.fire({ title: 'เพิ่มจำนวนวัน', input: 'number', inputValue: 30, showCancelButton: true })
    .then(r => { if(r.isConfirmed && r.value) {
        db.ref('custom_codes/' + id).once('value', s => {
            let cur = (s.val() && s.val().expireAt > Date.now()) ? s.val().expireAt : Date.now();
            db.ref('custom_codes/' + id).update({ expireAt: cur + (parseFloat(r.value)*86400000) });
        });
    }});
}

function popSetDays(id) {
    Swal.fire({ title: 'ตั้งค่าวันใหม่', input: 'number', inputValue: 1, showCancelButton: true })
    .then(r => { if(r.isConfirmed && r.value) {
        db.ref('custom_codes/' + id).update({ expireAt: Date.now() + (parseFloat(r.value)*86400000) });
    }});
}

checkAuth();
</script>
</body>
</html>
